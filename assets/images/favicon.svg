<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9357"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.95"/>

  <!-- Developer Code Bracket: < -->
  <path d="M21 21 L10 32 L21 43" stroke="url(#bracketGrad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Developer Code Slash: / -->
  <line x1="36" y1="17" x2="28" y2="47" stroke="url(#slashGrad)" stroke-width="4.8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Developer Code Bracket: > -->
  <path d="M43 21 L54 32 L43 43" stroke="url(#bracketGrad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
